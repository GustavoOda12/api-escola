spring.application.name=api-escola

# Profile ativo por padrao (pode ser sobrescrito por SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

server.port=8080

springdoc.swagger-ui.path=/

# ---------------------------------------------------------------
# Configuracoes do profile "default" (desenvolvimento local)
# SQL Server sobe via Docker (ver README.md). O banco api_escola
# precisa existir previamente: CREATE DATABASE api_escola;
# ---------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:api_escola};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:1q2w3e4R@}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# A aplicacao cria/atualiza as TABELAS automaticamente (o banco em si nao)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
