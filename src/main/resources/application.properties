spring.application.name=api-escola

# Profile ativo por padrao (pode ser sobrescrito por SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

server.port=8080

springdoc.swagger-ui.path=/

# ---------------------------------------------------------------
# Configuracoes do profile "default" (desenvolvimento local)
# Banco sobe via docker-compose.yml (docker-compose up -d)
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:api_escola}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Em desenvolvimento a aplicacao PODE criar/atualizar o schema automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect