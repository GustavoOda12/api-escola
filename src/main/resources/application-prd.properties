# ---------------------------------------------------------------
# Configuracoes do profile "prd" (producao)
# Todas as credenciais vem de variaveis de ambiente (ver README.md)
# ---------------------------------------------------------------
server.port=8080

springdoc.swagger-ui.path=/

spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# As tabelas sao criadas/atualizadas pelo Hibernate. O BANCO (api_escola)
# precisa existir previamente - o docker-compose.prd.yml o cria automaticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
