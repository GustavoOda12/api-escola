# ---------------------------------------------------------------
# Configuracoes do profile "prd" (producao)
# Todas as credenciais vem de variaveis de ambiente (ver README.md)
# ---------------------------------------------------------------
server.port=8080

springdoc.swagger-ui.path=/

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# IMPORTANTE: no profile prd a aplicacao NAO cria nem altera o banco/tabelas.
# O schema deve existir previamente (ver docker/mysql/init/schema.sql,
# executado automaticamente pelo container MySQL na primeira inicializacao).
# "validate" apenas confere se as entidades batem com o schema existente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
