# Ambiente de DESENVOLVIMENTO: sobe apenas o SQL Server (a API roda via mvnw).
#
# Uso:
#   docker compose up -d
#
# Atencao: o container do SQL Server NAO cria o banco sozinho. O servico
# "db-init" abaixo executa CREATE DATABASE api_escola (somente se ainda nao existir).
# Se voce ja tem outro SQL Server usando a porta 1433, pare-o antes de subir este.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:latest
    container_name: sqlserver-escola
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "1q2w3e4R@"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_escola_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Container descartavel: cria o banco e termina.
  db-init:
    image: mcr.microsoft.com/mssql/server:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    environment:
      MSSQL_SA_PASSWORD: "1q2w3e4R@"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -Q "IF DB_ID('api_escola') IS NULL CREATE DATABASE api_escola;"

volumes:
  sqlserver_escola_data:
